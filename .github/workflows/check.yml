name: Check sites

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Sites answer
        run: bash check.sh
      # GitHub pauses scheduled workflows of public repositories after 60 days without commits:
      # an empty commit every 45 days keeps the checks running.
      - name: Keep the schedule alive
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the site checks scheduled"
            git push
          fi
